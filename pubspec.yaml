name: amutbar_driver
description: "AmutBar Driver app for managing trips, receiving assignments, navigation, and shipment status updates."

publish_to: 'none'

version: 1.0.2+3

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^17.2.3
  dio: ^5.9.2
  flutter_secure_storage: ^10.3.0
  connectivity_plus: ^7.1.1
  url_launcher: ^6.3.2
  device_info_plus: ^13.1.0
  package_info_plus: ^10.1.0
  persian_datetime_picker: ^3.2.0
  intl: ^0.20.2
  camera: ^0.12.0+1
  permission_handler: ^12.0.1
  image_picker: ^1.2.2
  video_player: ^2.11.1
  flutter_launcher_icons: ^0.14.4
  audioplayers: ^6.6.0
  geocoding: ^4.0.0
  geolocator: ^14.0.1
  file_selector: ^1.1.0
  pinput: ^6.0.2
  sms_autofill: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
  fonts:
    - family: Vazir
      fonts:
        - asset: assets/fonts/Vazirmatn-FD-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-FD-Bold.ttf
          weight: 700

# این بخش جدید را دقیقاً بدون هیچ فاصله‌ای از ابتدای خط اضافه کنید:
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"

dependency_overrides:
  win32: ^6.3.0